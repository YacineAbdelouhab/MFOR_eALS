[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyspark-eals-rdd"
version = "0.1.0"
description = "RDD-only fast eALS and local online updates for implicit recommendation"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = ["numpy>=1.24,<2", "pyspark==3.5.7"]

[project.optional-dependencies]
test = ["pytest>=8,<9"]
figures = ["matplotlib>=3.7"]

[project.scripts]
eals-rdd-generate = "pyspark_eals_rdd.jobs.generate:main"
eals-rdd-train = "pyspark_eals_rdd.jobs.train:main"
eals-rdd-simple = "pyspark_eals_rdd.jobs.simple:main"
eals-rdd-figures = "pyspark_eals_rdd.jobs.figures:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
